<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Aktywnik+: dziennik aktywności dla siebie i dla rodziny">
  <defs>
    <linearGradient id="akt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07301f"/>
      <stop offset=".55" stop-color="#11543a"/>
      <stop offset="1" stop-color="#0a2a22"/>
    </linearGradient>
    <radialGradient id="akt-glow" cx="78%" cy="26%" r="62%">
      <stop offset="0" stop-color="#b6fb73" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b6fb73" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="akt-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ffe4"/>
      <stop offset="1" stop-color="#c9f18a"/>
    </linearGradient>
    <linearGradient id="akt-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6fd16a"/>
      <stop offset="1" stop-color="#d6fb63"/>
    </linearGradient>
    <linearGradient id="akt-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fdf3"/>
      <stop offset="1" stop-color="#e7f4e3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#akt-bg)"/>
  <rect width="1200" height="760" fill="url(#akt-glow)"/>
  <g opacity=".16" fill="none" stroke="#bdf59a" stroke-width="2">
