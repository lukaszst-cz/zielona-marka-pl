        <rect x="66" y="44" width="26" height="50" rx="8"/>
        <rect x="110" y="66" width="26" height="28" rx="8"/>
        <rect x="154" y="38" width="26" height="56" rx="8"/>
        <rect x="198" y="58" width="26" height="36" rx="8"/>
        <rect x="242" y="72" width="26" height="22" rx="8"/>
