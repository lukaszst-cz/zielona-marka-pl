  <text x="86" y="560" fill="#9fcaa9" font-family="Arial, Helvetica, sans-serif" font-size="22">Dziennik aktywności dla jednej osoby i dla całej rodziny.</text>
  <text x="86" y="594" fill="#9fcaa9" font-family="Arial, Helvetica, sans-serif" font-size="22">Dane zostają na urządzeniu, eksport w każdej chwili.</text>

