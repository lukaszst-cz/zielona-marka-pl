    <path d="M22 88 46 36h15l25 52h-16l-5-11H43l-5 11zm25-23h12l-6-14z" fill="#0a4932"/>
    <circle cx="90" cy="34" r="16" fill="#0d5839"/>
    <path d="M90 26v16m-8-8h16" stroke="#d8ffa6" stroke-width="4.5" stroke-linecap="round"/>
