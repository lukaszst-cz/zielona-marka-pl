        <text x="84" y="34" fill="#12402b" font-size="21" font-weight="700">Rower do szkoły</text>
        <text x="84" y="59" fill="#5f8169" font-size="17">22 min · rano</text>
      </g>
      <g transform="translate(26 238)">
