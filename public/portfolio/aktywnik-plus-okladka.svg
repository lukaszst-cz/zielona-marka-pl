  <text x="86" y="318" fill="#bdebc3" font-family="Arial, Helvetica, sans-serif" font-size="29">Ruch bez presji, zapisany po swojemu</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">
    <g transform="translate(86 360)">
      <rect width="186" height="50" rx="25" fill="rgba(214,251,99,.14)" stroke="#aee37a" stroke-opacity=".6"/>
      <text x="26" y="32" fill="#dcffb4">Tryb Dla siebie</text>
    </g>
    <g transform="translate(286 360)">
      <rect width="166" height="50" rx="25" fill="rgba(214,251,99,.14)" stroke="#aee37a" stroke-opacity=".6"/>
      <text x="26" y="32" fill="#dcffb4">Tryb Rodzina</text>
    </g>
    <g transform="translate(86 424)">
      <rect width="214" height="50" rx="25" fill="rgba(214,251,99,.14)" stroke="#aee37a" stroke-opacity=".6"/>
