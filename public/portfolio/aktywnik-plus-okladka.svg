        <circle cx="46" cy="39" r="22" fill="#e4f7cf"/>
        <path d="M46 28v22m-9-11h18" stroke="#2c7a46" stroke-width="4" stroke-linecap="round"/>
        <text x="84" y="34" fill="#12402b" font-size="21" font-weight="700">Trening piłki</text>
