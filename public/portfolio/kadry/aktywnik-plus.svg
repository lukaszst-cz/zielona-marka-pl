<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Aktywnik+: dziennik aktywności dla siebie i dla rodziny">
  <defs>
    <linearGradient id="akt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06291d"/><stop offset=".55" stop-color="#0d4330"/><stop offset="1" stop-color="#07231d"/>
    </linearGradient>
    <linearGradient id="akt-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6ea"/>
    </linearGradient>
    <linearGradient id="akt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6fb63"/><stop offset="1" stop-color="#6fd16a"/>
    </linearGradient>
    <linearGradient id="akt-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ffe4"/><stop offset="1" stop-color="#c9f18a"/>
    </linearGradient>
    <linearGradient id="akt-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fae63"/><stop offset="1" stop-color="#c7f56a"/>
    </linearGradient>
    <radialGradient id="akt-glow" cx="24%" cy="16%" r="62%">
      <stop offset="0" stop-color="#b6fb73" stop-opacity=".28"/><stop offset="1" stop-color="#b6fb73" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#akt-bg)"/>
  <rect width="1600" height="900" fill="url(#akt-glow)"/>

  <g transform="translate(96 92)" font-family="Arial, Helvetica, sans-serif">
    <rect x="10" y="14" width="1408" height="748" rx="26" fill="rgba(2,18,12,.45)"/>
    <rect width="1408" height="740" rx="22" fill="url(#akt-panel)"/>
    <rect width="1408" height="64" rx="22" fill="#12422f"/>
    <rect y="40" width="1408" height="24" fill="#12422f"/>
    <circle cx="36" cy="32" r="7" fill="#ff5f57"/><circle cx="60" cy="32" r="7" fill="#febc2e"/><circle cx="84" cy="32" r="7" fill="#28c840"/>
    <text x="120" y="39" fill="#d8f3c6" font-size="19" font-weight="700">Aktywnik+ · dziennik aktywności</text>
    <text x="1136" y="39" fill="#9fd0ad" font-size="16">zapis lokalny, bez konta</text>

    <!-- Znak i nagłówek -->
    <g transform="translate(44 100)">
      <rect width="84" height="84" rx="22" fill="url(#akt-mark)"/>
      <path d="M16 64 33 26h11l18 38h-12l-3.5-8H31l-3.5 8z" fill="#0a4932"/>
      <path d="M33 48h9l-4.5-10z" fill="#f3ffe4"/>
      <circle cx="64" cy="24" r="12" fill="#0d5839"/>
      <path d="M64 18v12m-6-6h12" stroke="#d8ffa6" stroke-width="3.6" stroke-linecap="round"/>
      <text x="104" y="40" fill="#103a28" font-size="38" font-weight="800">Aktywnik+</text>
      <text x="104" y="70" fill="#5c7d66" font-size="18">Ruch bez presji i bez porównywania dzieci</text>
    </g>
    <g transform="translate(1016 108)">
      <rect width="348" height="68" rx="18" fill="#12422f"/>
      <text x="26" y="30" fill="#b6fb73" font-size="14" font-weight="700" letter-spacing="2">WERSJA</text>
      <text x="26" y="56" fill="#ffffff" font-size="22" font-weight="800">0.5.0 beta · PWA</text>
    </g>

    <!-- Wskaźniki tygodnia -->
    <g transform="translate(44 212)">
      <g fill="#f3faef" stroke="#cfe3cb">
        <rect width="286" height="120" rx="16"/>
        <rect x="310" width="286" height="120" rx="16"/>
        <rect x="620" width="286" height="120" rx="16"/>
      </g>
      <rect x="930" width="390" height="120" rx="16" fill="url(#akt-accent)"/>
      <g fill="#5c7d66" font-size="14" font-weight="700" letter-spacing="2">
        <text x="22" y="36">WPISY W TYGODNIU</text><text x="332" y="36">CZAS RUCHU</text><text x="642" y="36">SERIA DNI</text>
      </g>
      <text x="952" y="36" fill="#0e3220" font-size="14" font-weight="800" letter-spacing="2">TRYB RODZINA</text>
      <g fill="#103a28" font-size="42" font-weight="800">
        <text x="22" y="92">14</text><text x="332" y="92">6 h 20</text><text x="642" y="92">9</text>
      </g>
      <text x="952" y="92" fill="#0e3220" font-size="26" font-weight="800">3 profile w domu</text>
    </g>

    <!-- Dziennik -->
    <g transform="translate(44 360)" font-size="17">
      <text x="0" y="-8" fill="#103a28" font-size="20" font-weight="800">Dziennik: wtorek</text>
      <g>
        <rect y="12" width="876" height="70" rx="14" fill="#ffffff" stroke="#e1eedb"/>
        <circle cx="46" cy="47" r="22" fill="#e4f7cf"/>
        <path d="M34 54c8-18 14-18 22 0" stroke="#2c7a46" stroke-width="4" fill="none" stroke-linecap="round"/>
        <text x="88" y="42" fill="#12402b" font-weight="700">Rower do szkoły</text>
        <text x="88" y="66" fill="#5f8169" font-size="15">22 min · rano · bez presji</text>
        <rect x="716" y="30" width="134" height="32" rx="16" fill="#d7f5b4"/>
        <text x="736" y="51" font-size="14" font-weight="700" fill="#1d5c2c">zapisane</text>
      </g>
      <g transform="translate(0 86)">
        <rect y="12" width="876" height="70" rx="14" fill="#ffffff" stroke="#e1eedb"/>
        <circle cx="46" cy="47" r="22" fill="#e4f7cf"/>
        <path d="M46 36v22m-11-11h22" stroke="#2c7a46" stroke-width="4" stroke-linecap="round"/>
        <text x="88" y="42" fill="#12402b" font-weight="700">Trening piłki</text>
        <text x="88" y="66" fill="#5f8169" font-size="15">75 min · klub · wpis od rodzica</text>
        <rect x="716" y="30" width="134" height="32" rx="16" fill="#d7f5b4"/>
        <text x="736" y="51" font-size="14" font-weight="700" fill="#1d5c2c">zapisane</text>
      </g>
      <g transform="translate(0 172)">
        <rect y="12" width="876" height="70" rx="14" fill="#f7fbf4" stroke="#e1eedb" stroke-dasharray="6 5"/>
        <circle cx="46" cy="47" r="22" fill="#ffffff" stroke="#bcdcb6"/>
        <path d="M46 37v20m-10-10h20" stroke="#6b9478" stroke-width="3.6" stroke-linecap="round"/>
        <text x="88" y="54" fill="#6b8d78">Dodaj wpis: spacer, basen, podwórko</text>
      </g>
      <g transform="translate(0 258)">
        <rect y="12" width="876" height="92" rx="14" fill="#ffffff" stroke="#e1eedb"/>
        <text x="24" y="44" fill="#103a28" font-size="17" font-weight="800">Ten tydzień</text>
        <g fill="url(#akt-bar)">
          <rect x="24" y="56" width="98" height="30" rx="8"/>
          <rect x="140" y="48" width="98" height="38" rx="8"/>
          <rect x="256" y="64" width="98" height="22" rx="8"/>
          <rect x="372" y="44" width="98" height="42" rx="8"/>
          <rect x="488" y="58" width="98" height="28" rx="8"/>
          <rect x="604" y="70" width="98" height="16" rx="8"/>
          <rect x="720" y="52" width="98" height="34" rx="8"/>
        </g>
      </g>
    </g>

    <!-- Telefon -->
    <g transform="translate(980 356)">
      <rect x="-14" y="-14" width="364" height="384" rx="46" fill="rgba(3,24,16,.5)"/>
      <rect width="336" height="356" rx="38" fill="#12422f"/>
      <rect x="18" y="24" width="300" height="312" rx="26" fill="#f7fdf3"/>
      <rect x="138" y="12" width="60" height="8" rx="4" fill="#9ec6a8"/>
      <text x="44" y="70" fill="#0d3c29" font-size="22" font-weight="800">Rodzina</text>
      <g font-size="15">
        <g transform="translate(44 88)">
          <rect width="252" height="56" rx="14" fill="#ffffff" stroke="#cfe6cd"/>
          <circle cx="32" cy="28" r="17" fill="#e4f7cf"/><text x="24" y="34" fill="#2b6b3b" font-size="14" font-weight="800">OW</text>
          <text x="62" y="26" fill="#12402b" font-weight="700">Ola</text>
          <text x="62" y="46" fill="#5f8169" font-size="13">5 wpisów w tygodniu</text>
        </g>
        <g transform="translate(44 156)">
          <rect width="252" height="56" rx="14" fill="#ffffff" stroke="#cfe6cd"/>
          <circle cx="32" cy="28" r="17" fill="#e4f7cf"/><text x="24" y="34" fill="#2b6b3b" font-size="14" font-weight="800">MW</text>
          <text x="62" y="26" fill="#12402b" font-weight="700">Marek</text>
          <text x="62" y="46" fill="#5f8169" font-size="13">3 wpisy w tygodniu</text>
        </g>
        <g transform="translate(44 224)">
          <rect width="252" height="56" rx="14" fill="#eef9e2" stroke="#cfe6cd"/>
          <text x="22" y="34" fill="#1d5c2c" font-size="14" font-weight="700">Eksport danych do pliku</text>
        </g>
      </g>
      <rect x="44" y="296" width="252" height="40" rx="20" fill="url(#akt-accent)"/>
      <text x="104" y="322" fill="#0e3220" font-size="16" font-weight="800">Dodaj aktywność</text>
    </g>
  </g>
</svg>
