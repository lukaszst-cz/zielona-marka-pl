name: Public website browser QA

on:
  workflow_run:
    workflows: ["Verify project"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser interactions and responsive screenshots
        run: node tests/live-browser-qa.mjs
        env:
          BROWSER_QA_URL: https://zielona-marka.pl
      - name: Save screenshots and structured QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zielona-marka-browser-qa
          path: browser-qa-artifacts/
          retention-days: 14
          if-no-files-found: warn
