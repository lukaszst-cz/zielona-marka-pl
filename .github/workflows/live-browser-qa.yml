name: Public website browser QA

on:
  workflow_run:
    workflows: ["Verify project"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
  schedule:
    # 04:30 UTC = 06:30 Warsaw in summer, 05:30 in winter.
    - cron: "30 4 * * *"

permissions:
  contents: read
  checks: read

# A new successful main CI supersedes an old test of a potentially stale deployment.
concurrency:
  group: public-website-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          (github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wait for matching Cloudflare production build
        if: github.event_name == 'workflow_run'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/wait-for-cloudflare-build.mjs
      - name: Install isolated Chromium test runtime
        run: |
          mkdir -p /tmp/zm-browser-qa
          npm --prefix /tmp/zm-browser-qa install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          /tmp/zm-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser interactions and responsive screenshots
        run: node tests/live-browser-qa.mjs
        env:
          BROWSER_QA_URL: https://zielona-marka.pl
          BROWSER_QA_PLAYWRIGHT_ENTRY: /tmp/zm-browser-qa/node_modules/playwright/index.mjs
      - name: Measure page resources and lab loading metrics
        run: node tests/load-footprint.mjs
        env:
          BROWSER_QA_URL: https://zielona-marka.pl
          BROWSER_QA_PLAYWRIGHT_ENTRY: /tmp/zm-browser-qa/node_modules/playwright/index.mjs
      - name: Verify every original concept and its full-screen preview
        run: node tests/concept-gallery-browser.mjs
        env:
          BROWSER_QA_URL: https://zielona-marka.pl
          BROWSER_QA_PLAYWRIGHT_ENTRY: /tmp/zm-browser-qa/node_modules/playwright/index.mjs
      - name: Save screenshots and structured QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zielona-marka-browser-qa
          path: browser-qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
