name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit report
        run: npm audit --json || true
      - run: npm run lint
      - name: Validate QMS process templates
        run: node scripts/verify-qms.mjs
      - name: Set up Python for QMS report tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate evidence-backed PDF report generator
        run: |
          python -m pip install -r docs/qms/requirements-qms.txt
          python -m unittest discover -s scripts -p 'test_qms_report.py'
      - name: Audit brand spelling in public PDF downloads
        run: python scripts/verify_brand_pdfs.py
      - run: npm test
      - name: Install isolated browser for pre-deployment gallery verification
        run: |
          mkdir -p /tmp/zm-browser-qa
          npm --prefix /tmp/zm-browser-qa install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          /tmp/zm-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify gallery and guarded server forms before deployment
        run: |
          node scripts/run-built-worker-tests.mjs --gallery
          node scripts/run-built-worker-tests.mjs --forms
        env:
          BROWSER_QA_PLAYWRIGHT_ENTRY: /tmp/zm-browser-qa/node_modules/playwright/index.mjs
      - name: Check generated Cloudflare Worker bundle without publishing
        run: |
          test -f dist/server/wrangler.json
          test -d dist/client
          node scripts/prepare-vinext-wrangler-config.mjs
          npx --no-install wrangler deploy --config dist/server/wrangler.json --no-bundle --dry-run
      - name: Simulate default Workers Builds deployment command
        run: npx --no-install wrangler deploy --dry-run
      - name: Dependency update report
        continue-on-error: true
        run: npm outdated || true
