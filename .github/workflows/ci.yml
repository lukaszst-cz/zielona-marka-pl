name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test security dependency upgrades
        run: |
          npm install --save-exact --no-audit             react@19.3.0 react-dom@19.3.0 react-server-dom-webpack@19.3.0             vite@8.3.4 @cloudflare/vite-plugin@1.63.0 wrangler@4.146.0             vinext@1.0.1 @next/eslint-plugin-next@16.4.0 drizzle-kit@0.31.11
      - name: Dependency audit report
        run: npm audit --json || true
      - name: Candidate dependency files
        run: |
          echo "__PACKAGE_JSON_BEGIN__"
          base64 package.json
          echo "__PACKAGE_JSON_END__"
          echo "__PACKAGE_LOCK_BEGIN__"
          base64 package-lock.json
          echo "__PACKAGE_LOCK_END__"
      - run: npm run lint
      - run: npm test
