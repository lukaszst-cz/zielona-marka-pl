name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit report
        run: npm audit --json || true
      - run: npm run lint
      - name: Validate QMS process templates
        run: node scripts/verify-qms.mjs
      - name: Set up Python for QMS report tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate evidence-backed PDF report generator
        run: |
          python -m pip install -r docs/qms/requirements-qms.txt
          python -m unittest discover -s scripts -p 'test_qms_report.py'
      - run: npm test
      - name: Check generated Cloudflare Worker bundle without publishing
        run: |
          test -f dist/server/wrangler.json
          test -d dist/client
          node scripts/prepare-vinext-wrangler-config.mjs
          npx --no-install wrangler deploy --config dist/server/wrangler.json --no-bundle --dry-run
      - name: Simulate default Workers Builds deployment command
        run: npx --no-install wrangler deploy --dry-run
      - name: Dependency update report
        continue-on-error: true
        run: npm outdated || true
