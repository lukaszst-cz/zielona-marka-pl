name: Build corrected brand PDF editions

on:
  push:
    branches:
      - fix/brand-pdf-corrected-editions-20261015
    paths:
      - scripts/reissue_brand_pdfs.py
      - .github/workflows/pdf-brand-corrected-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    if: github.ref == 'refs/heads/fix/brand-pdf-corrected-editions-20261015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/brand-pdf-corrected-editions-20261015
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF edition tool
        run: python -m pip install 'PyMuPDF>=1.25,<2'
      - name: Generate and visually verify corrected editions
        run: python scripts/reissue_brand_pdfs.py
      - name: Commit corrected, separately versioned PDF files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/*-v3-1-korekta.pdf
          if git diff --cached --quiet; then
            echo 'Files already up to date'
          else
            git commit -m 'Add visually verified correction PDFs for public standards'
            git push origin HEAD:fix/brand-pdf-corrected-editions-20261015
          fi
