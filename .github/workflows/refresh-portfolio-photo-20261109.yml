name: Jednorazowa podmiana fotografii portfolio 2026-11-09

on:
  push:
    branches:
      - fix/portfolio-spojnosc-grafiki-20261109

permissions:
  contents: write

jobs:
  import-media:
    if: contains(github.event.head_commit.message, '[assets-20261109]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-spojnosc-grafiki-20261109
          persist-credentials: true
      - name: Pobierz i zoptymalizuj autorskie nowe fotografie demonstracyjne
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          photos = {
              "public/portfolio/solidom-foto-20261109.webp":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211951_7ea522be-dd6b-49d6-86c4-81d31ea0ccce.png",
              "public/portfolio/solident-foto-20261109.webp":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211952_870d9c7e-e492-47d4-ade4-276bba1a6526.png",
              "public/portfolio/black-harbor-foto-20261109.webp":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211553_de2cc6b4-d102-4e4e-b86d-5127d8318107.png",
              "public/concept-natura.jpg":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211554_665bf669-9084-4536-b648-f7eb5a8199cd.png",
              "public/concept-bistro.jpg":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211555_dcb545a2-bdeb-4d35-b6a7-8719af5d1b9e.png",
              "public/concept-dom.jpg":
                "https://d8j0ntlcm91z4.cloudfront.net/user_3JF0bAXNGCfkXeILZKHayHagGgi/hf_20261109_211554_4ab74ab4-ac38-4bf4-8185-290e12f7d3d6.png",
          }
          for filename, url in photos.items():
              request = Request(url, headers={"User-Agent": "Mozilla/5.0 (Zielona Marka asset import)"})
              with urlopen(request, timeout=60) as response:
                  blob = response.read()
              if len(blob) < 10_000:
                  raise RuntimeError(f"Niepoprawny lub pusty obraz: {filename}")
              image = Image.open(BytesIO(blob))
              image.load()
              image = ImageOps.exif_transpose(image).convert("RGB")
              if image.width < 800 or image.height < 500:
                  raise RuntimeError(f"Za mała rozdzielczość: {filename}")
              image = ImageOps.fit(image, (1280, 720), method=Image.Resampling.LANCZOS)
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.suffix == ".webp":
                  image.save(target, "WEBP", quality=84, method=6)
              else:
                  image.save(target, "JPEG", quality=85, optimize=True, progressive=True)
              print(f"{target}: {target.stat().st_size} bajtów")
          PY
      - name: Zapisz obrazy w gałęzi roboczej bez publikacji
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio/solidom-foto-20261109.webp public/portfolio/solident-foto-20261109.webp public/portfolio/black-harbor-foto-20261109.webp public/concept-natura.jpg public/concept-bistro.jpg public/concept-dom.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: nowe zdjęcia demonstracyjne portfolio (4)"
          git push origin HEAD:fix/portfolio-spojnosc-grafiki-20261109
