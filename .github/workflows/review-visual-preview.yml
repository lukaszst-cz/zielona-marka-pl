name: Review branch visual QA

on:
  push:
    branches: [review/premium-clarity-a-b-c-20261015, release/blog-unification-20261015, release/forest-seam-final-20261015, fix/home-scroll-editorial-layout-20261015, fix/home-decoration-overflow-20261016]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build production preview locally
        run: npm run build
      - name: Validate Cloudflare bundle without deploying
        run: |
          node scripts/prepare-vinext-wrangler-config.mjs
          npx --no-install wrangler deploy --config dist/server/wrangler.json --no-bundle --dry-run
      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/zm-review-browser
          npm --prefix /tmp/zm-review-browser install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          /tmp/zm-review-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser QA against local build without publication
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vinext start --port 8788 > /tmp/zm-review-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8788/ -o /dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/zm-review-server.log; exit 1; fi
          BROWSER_QA_URL=http://127.0.0.1:8788 \
          BROWSER_QA_FULL=1 \
          BROWSER_QA_PLAYWRIGHT_ENTRY=/tmp/zm-review-browser/node_modules/playwright/index.mjs \
            node tests/live-browser-qa.mjs
          BROWSER_QA_URL=http://127.0.0.1:8788 \
          BROWSER_QA_PLAYWRIGHT_ENTRY=/tmp/zm-review-browser/node_modules/playwright/index.mjs \
            node tests/accessibility-preview.mjs
          BROWSER_QA_URL=http://127.0.0.1:8788 \
          BROWSER_QA_PLAYWRIGHT_ENTRY=/tmp/zm-review-browser/node_modules/playwright/index.mjs \
            node tests/preview-navigation.mjs
      - name: Upload previews and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zm-review-visual-preview
          path: |
            browser-qa-artifacts/report.json
            browser-qa-artifacts/desktop-home.png
            browser-qa-artifacts/mobile-home.png
            browser-qa-artifacts/compact-home.png
            browser-qa-artifacts/desktop-blog.png
            browser-qa-artifacts/desktop-offer.png
            browser-qa-artifacts/mobile-blog.png
            browser-qa-artifacts/mobile-offer.png
            browser-qa-artifacts/compact-blog.png
            browser-qa-artifacts/compact-offer.png
            browser-qa-artifacts/tablet-blog.png
            browser-qa-artifacts/tablet-offer.png
            browser-qa-artifacts/laptop-blog.png
            browser-qa-artifacts/laptop-offer.png
          retention-days: 14
          if-no-files-found: warn
